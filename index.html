<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="แล็บเคมีเสมือนบนเว็บ สร้างโมเลกุลจากตารางธาตุด้วย AR/VR (WebXR) มือ คอนโทรลเลอร์ หรือหน้าจอสัมผัส" />
  <title>ChemXR Lab — แล็บเคมี AR/VR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <video id="camera-feed" playsinline muted autoplay></video>
  <div id="stage"></div>

  <div id="overlay">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">⚛</span>
        <div>
          <strong>ChemXR Lab</strong>
          <small data-i18n="appSubtitle"></small>
        </div>
      </div>
      <nav class="modes">
        <button id="btn-ar" class="primary">🥽 <span data-i18n="enterAR"></span></button>
        <button id="btn-vr">🕶️ <span data-i18n="enterVR"></span></button>
        <button id="btn-camera">📷 <span data-i18n="camera"></span></button>
        <button id="btn-lang" aria-label="Language">EN</button>
        <button id="btn-help" aria-label="Help">?</button>
      </nav>
    </header>

    <div id="xr-bar">
      <button id="btn-exit">✕ <span data-i18n="exitXR"></span></button>
      <button id="btn-recenter">⟲ <span data-i18n="recenter"></span></button>
    </div>

    <section id="challenge-bar" hidden>
      <span id="challenge-text"></span>
      <button id="btn-skip" data-i18n="skip"></button>
    </section>

    <aside id="info-card">
      <button id="btn-info-toggle" class="collapse" aria-label="Toggle info">▾</button>
      <div id="info-body"></div>
    </aside>

    <div id="toolbar">
      <button id="btn-clear">🗑 <span data-i18n="clear"></span></button>
      <button id="btn-challenge">🎯 <span data-i18n="challenge"></span></button>
      <button id="btn-lp">•• <span data-i18n="lonePairs"></span></button>
      <button id="btn-plus">⊕ <span data-i18n="chargePlus"></span></button>
      <button id="btn-minus">⊖ <span data-i18n="chargeMinus"></span></button>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <dialog id="help-dialog">
    <div id="help-body"></div>
    <button id="btn-help-close" class="primary">OK</button>
  </dialog>

  <noscript>ต้องเปิด JavaScript เพื่อใช้งาน / JavaScript is required.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
